pdf:
  dpi: 200

crop_whitespace:
  enabled: true
  threshold: 200
  dilate_kernel: [15, 15]
  dilate_iter: 3
  margin: 15
  open_kernel: [3, 3]
  min_contour_area_ratio: 0.0008
  max_content_area_ratio: 0.5

page_deskew:
  enabled: false   # small-tilt correction (< max_angle deg), reuses ocr.text_detector
  min_boxes: 5
  angle_threshold: 0.5
  max_angle: 10.0

page_orientation:
  enabled: false   # 0/90/270 rotation correction via OCR confidence scoring
  score_threshold: 0.8
  sample_max: 20
  min_scores: 5
  # 90/270 are only ever OCR-scored if MORE than sideways_min_count boxes AND
  # MORE than sideways_min_ratio of all boxes are taller-than-wide -- an
  # upright page's boxes are wide, not tall, so this keeps an already-straight
  # page from being rotated by OCR noise alone.
  sideways_min_count: 4
  sideways_min_ratio: 0.3

layout:
  backend: pp_doclayout
  model_name: PP-DocLayout_plus-L
  # device: cpu   # uncomment to force a device; unset = auto-detect GPU/CPU
  threshold: 0.2
  # Layout detection now runs ONCE per document, batched across all pages
  # (see PPDocLayoutBackend.detect_batch / DocumentPipeline.process_pdf),
  # instead of once per page. max_batch_size caps how many pages PaddleX
  # stacks into one forward pass at a time, so a document with far more
  # pages than fit in GPU memory at once doesn't OOM.
  max_batch_size: 8

ocr:
  model_dir: null
  det_backend: onnx   # onnx | mineru -- bbox detector for BOTH page OCR and table OCR
  vietocr_weight_path: "vietocr/weight/vgg_seq2seq.pth"
  vietocr_base_config: "vgg_seq2seq"
  crop_pad_px_h: 3
  crop_pad_px_w: 0
  # Caps how many images OCR.detect_raw_batch()/detect_sorted_batch() (used
  # by page_orientation.py's batched 0-degree detect, and by the mineru
  # table backend's batched wired-crop detect) stack into one forward pass
  # at a time. Only takes effect for det_backend: mineru (its detector's
  # own batch_predict() honors this) -- the onnx detector has no batch API
  # at all, so this is a no-op for it.
  max_batch_size: 8
  # Caps how many text-line crops TextRecognizer.__call__() (whole-page
  # VietOCR recognition, see module/ocr/engine.py) stacks into one
  # Predictor.predict_batch() forward pass at a time. A dense page can have
  # 100+ detected boxes -- without this cap they'd all get batched
  # unbounded in one call, risking a GPU OOM. Higher than layout/table's
  # max_batch_size (8) since VietOCR's per-crop cost is much smaller (a
  # single text line vs a full page/table image).
  vietocr_max_batch_size: 64

tsr:
  threshold: 0.2

table:
  backend: tsr   # tsr | mineru
  # Caps how many table crops the mineru backend's process_batch() stacks
  # into one TableOrientationCls / Surya (TableRecPredictor+DetectionPredictor)
  # forward pass at a time, so a document with many tables doesn't hand
  # them all to one unbounded batch call and risk a GPU OOM.
  max_batch_size: 8

mapping:
  overlap_threshold: 0.5
  figure_drop_types: [image]
  figure_drop_ratio: 0.4
  line_overlap_min: 0.5

reading_order:
  single_page_ratio_max: 0.85
  spanning_min_ratio: 0.15
  anchor_min_width: 100
  anchor_band_mult: 1.0

output:
  dir: "./pipeline_outputs_v3_217f8c7ab6d9cf9ea3021032561c6441bbc2a2ed_fix_bang_wireless"

debug:
  enabled: true
  dir: "./debug_outputs"
